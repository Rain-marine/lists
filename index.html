<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tickoff</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1311" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tickoff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #F5F8F6;
  --ink: #14231F;
  --muted: #5C6E67;
  --line: #D5DED9;
  --accent: #176B52;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE5;
  --danger: #B3361F;
  --font-display: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1311;
    --surface: #141E1B;
    --surface-2: #1A2622;
    --ink: #E4EEE9;
    --muted: #8FA59C;
    --line: #26362F;
    --accent: #46C39A;
    --accent-ink: #06241B;
    --accent-soft: #17342B;
    --danger: #F08A74;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
a { color: var(--accent); }

.shell { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.status { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.status[data-s="syncing"] i { background: transparent; border: 2px solid var(--accent); }
.status[data-s="local"] i { border-radius: 2px; background: var(--muted); }
.status[data-s="offline"] i { border-radius: 2px; background: transparent; border: 2px solid var(--muted); }
.status[data-s="error"] i { border-radius: 2px; background: var(--danger); transform: rotate(45deg); }

.sync { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.sync h2 { margin: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: -0.01em; }
.sync p { margin: 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
.sync ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; max-width: 62ch; }
.sync input[type="password"], .sync input[type="text"] { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-family: var(--font-mono); font-size: 16px; }
.sync .err { color: var(--danger); }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }

.cols { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.side { display: grid; gap: 10px; min-width: 0; }
.nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.navbtn { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; font-weight: 500; text-align: left; }
.navbtn svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.navbtn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navbtn .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.newbtn { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; color: var(--muted); font-weight: 500; }
.newbtn svg { width: 18px; height: 18px; }
.newbtn:hover { color: var(--ink); border-color: var(--muted); }

@media (max-width: 720px) {
  .cols { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .side { grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
  .nav { flex-direction: row; overflow-x: auto; gap: 8px; padding-bottom: 4px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav li { flex: none; }
  .navbtn { width: auto; white-space: nowrap; border-color: var(--line); background: var(--surface); }
  .navbtn .name { max-width: 14ch; }
  .newform { grid-column: 1 / -1; }
}
.navbtn[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.navbtn[aria-current="true"] svg { color: var(--accent); }

.newform { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.newform input[type="text"] { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.segopt { position: relative; }
.segopt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.segopt span { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.segopt svg { width: 16px; height: 16px; }
.segopt input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.segopt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; min-height: 280px; }
@media (max-width: 720px) { .panel { padding: 14px; } }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head > div { min-width: 0; }
.title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 30px); letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
.titlebtn { background: none; border: 0; padding: 4px 6px; margin: -4px -6px; font: inherit; letter-spacing: inherit; text-align: left; border-radius: 8px; cursor: text; }
.titlebtn:hover { background: var(--surface-2); }
.renamein { width: 100%; min-height: 44px; padding: 0 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface-2); font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; }
.meta { margin-top: 4px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost { min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: 14px; }
.ghost:hover { border-color: var(--muted); }
.ghost.danger { color: var(--danger); }
.ghost.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.primary { min-height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary.small { min-height: 44px; }

.add { display: flex; gap: 8px; margin-block: 18px 6px; }
.add input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }

.items { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: center; gap: 2px; min-height: 52px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.check { position: relative; flex: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; }
.check input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
.box { width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 7px; display: grid; place-items: center; transition: background 0.12s, border-color 0.12s; }
.box::after { content: ""; width: 6px; height: 12px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box::after { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 3px; }
.itext { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 6px; cursor: text; overflow-wrap: anywhere; }
.done .itext { color: var(--muted); text-decoration: line-through; }
.editin { flex: 1; min-width: 0; min-height: 40px; padding: 0 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface-2); }
.rm { flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; color: var(--muted); }
.rm:hover { color: var(--danger); }
.rm svg { width: 18px; height: 18px; }

.donehead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
.donetoggle { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0; background: none; border: 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.donetoggle svg { width: 14px; height: 14px; transition: transform 0.15s; }
.donetoggle[aria-expanded="false"] svg { transform: rotate(-90deg); }

.hint { margin: 18px 0 0; color: var(--muted); }
.empty { padding-block: 24px 8px; max-width: 46ch; }
.empty h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 24px; letter-spacing: -0.02em; }
.empty p { margin: 0 0 18px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; }

@media (prefers-reduced-motion: reduce) { .box, .donetoggle svg { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="20" height="20" rx="6"/><path d="M8.5 13.4l3.2 3.2 6-6.6"/></svg>
      Tickoff
    </div>
    <button class="status" id="status" type="button" data-s="local" aria-expanded="false" aria-controls="sync"><i></i><span>On this device</span></button>
  </header>

  <section class="sync" id="sync" hidden aria-label="Sync settings"></section>

  <div class="cols">
    <aside class="side">
      <ul class="nav" id="nav" aria-label="Your lists"></ul>
      <button class="newbtn" id="newBtn" type="button"></button>
      <form class="newform" id="newForm" hidden>
        <input type="text" id="newName" maxlength="80" placeholder="List name" autocomplete="off" aria-label="List name">
        <div class="seg" role="radiogroup" aria-label="List type">
          <label class="segopt"><input type="radio" name="kind" value="todo" checked><span id="segTodo"> To-do</span></label>
          <label class="segopt"><input type="radio" name="kind" value="shopping"><span id="segShop"> Shopping</span></label>
        </div>
        <div class="row2">
          <button class="primary small" type="submit">Create</button>
          <button class="ghost" id="newCancel" type="button">Cancel</button>
        </div>
      </form>
    </aside>

    <main class="panel" id="panel">
      <div id="head"></div>
      <form class="add" id="addForm" hidden>
        <input type="text" id="addInput" maxlength="200" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="New item">
        <button class="primary" type="submit">Add</button>
      </form>
      <div id="body"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var Core = window.TickoffCore;
  var $ = function (s) { return document.querySelector(s); };
  var DATA_KEY = 'tickoff:data:v1';
  var SYNC_KEY = 'tickoff:sync:v1';
  var ACTIVE_KEY = 'tickoff:active';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* ---------- state ---------- */
  var data = Core.emptyData();
  try { data = Core.validate(JSON.parse(lsGet(DATA_KEY) || 'null')); } catch (e) {}
  var cfg = { token: '', gistId: '', etag: '', lastSync: 0 };
  try { Object.assign(cfg, JSON.parse(lsGet(SYNC_KEY) || '{}')); } catch (e) {}

  var ui = {
    activeId: null, renaming: false, editingId: null, confirmDelete: false,
    collapsed: {}, syncOpen: false, sync: 'local', syncMsg: '', copyLink: '', connectErr: ''
  };

  var lastTs = 0;
  function ts() { lastTs = Math.max(Date.now(), lastTs + 1); return lastTs; }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  var dirty = lsGet(DATA_KEY + ':dirty') === '1';
  function persist(markDirty) {
    lsSet(DATA_KEY, Core.serialize(data));
    if (markDirty) { dirty = true; lsSet(DATA_KEY + ':dirty', '1'); }
  }
  function saveCfg() { lsSet(SYNC_KEY, JSON.stringify(cfg)); }

  /* ---------- derived ---------- */
  function lists() {
    return Object.keys(data.lists).map(function (k) { return data.lists[k]; })
      .filter(function (l) { return !l.deleted; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0) || (a.id < b.id ? -1 : 1); });
  }
  function active() { return lists().find(function (l) { return l.id === ui.activeId; }) || null; }
  function itemsOf(id) {
    return Object.keys(data.items).map(function (k) { return data.items[k]; })
      .filter(function (i) { return i.listId === id && !i.deleted; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0) || (a.id < b.id ? -1 : 1); });
  }
  function ensureActive() {
    var ls = lists();
    if (ui.activeId && ls.some(function (l) { return l.id === ui.activeId; })) return;
    var saved = lsGet(ACTIVE_KEY);
    var pick = ls.find(function (l) { return l.id === saved; }) || ls[0];
    ui.activeId = pick ? pick.id : null;
  }

  /* ---------- mutations (all local first, sync follows) ---------- */
  var model = {
    createList: function (name, kind) {
      var id = uid(), t = ts();
      data.lists[id] = { id: id, name: name, kind: kind, createdAt: t, updatedAt: t };
      changed(); return id;
    },
    renameList: function (id, name) { data.lists[id] = Object.assign({}, data.lists[id], { name: name, updatedAt: ts() }); changed(); },
    deleteList: function (id) {
      var t = ts();
      data.lists[id] = { id: id, name: '', kind: data.lists[id].kind, createdAt: data.lists[id].createdAt, updatedAt: t, deleted: true };
      Object.keys(data.items).forEach(function (k) {
        var it = data.items[k];
        if (it.listId === id && !it.deleted) data.items[k] = { id: k, listId: id, text: '', done: false, createdAt: it.createdAt, updatedAt: t, deleted: true };
      });
      changed();
    },
    addItem: function (listId, text) {
      var id = uid(), t = ts();
      data.items[id] = { id: id, listId: listId, text: text, done: false, createdAt: t, updatedAt: t };
      changed();
    },
    toggleItem: function (id) { var it = data.items[id]; if (!it) return; var t = ts(); data.items[id] = Object.assign({}, it, { done: !it.done, doneAt: t, updatedAt: t }); changed(); },
    editItem: function (id, text) { data.items[id] = Object.assign({}, data.items[id], { text: text, updatedAt: ts() }); changed(); },
    deleteItem: function (id) { var it = data.items[id]; if (!it) return; data.items[id] = { id: id, listId: it.listId, text: '', done: false, createdAt: it.createdAt, updatedAt: ts(), deleted: true }; changed(); },
    clearDone: function (listId) {
      itemsOf(listId).filter(function (i) { return i.done; }).forEach(function (i) {
        data.items[i.id] = { id: i.id, listId: listId, text: '', done: false, createdAt: i.createdAt, updatedAt: ts(), deleted: true };
      });
      changed();
    }
  };
  function changed() { persist(true); if (cfg.token) ui.sync = 'syncing'; refresh(); scheduleSync(800); }

  /* ---------- sync ---------- */
  var syncing = false, again = false, syncTimer = null, verifyTimer = null;
  function scheduleSync(ms) { clearTimeout(syncTimer); if (cfg.token) syncTimer = setTimeout(syncNow, ms); }

  async function syncNow() {
    if (!cfg.token) return;
    if (syncing) { again = true; return; }
    syncing = true; again = false;
    ui.sync = 'syncing'; renderStatus();
    var sentSerialized = Core.serialize(data);
    try {
      var r = await Core.syncOnce({ fetch: window.fetch.bind(window), token: cfg.token, gistId: cfg.gistId, etag: cfg.etag, data: JSON.parse(sentSerialized), dirty: dirty });
      cfg.gistId = r.gistId; cfg.etag = r.etag || ''; cfg.lastSync = Date.now(); saveCfg();
      var merged = Core.mergeData(data, r.data);   // keeps anything typed while the request was in flight
      var stillDirty = Core.serialize(merged) !== Core.serialize(r.data);
      var differs = Core.serialize(merged) !== Core.serialize(data);
      data = merged;
      dirty = stillDirty; lsSet(DATA_KEY + ':dirty', dirty ? '1' : '0');
      if (differs) { persist(false); refresh(); }
      ui.sync = 'ok'; ui.syncMsg = '';
      if (stillDirty) again = true;
      // Two devices pushing in the same instant can overwrite each other. A quick re-check
      // after every push notices that and repairs it (it costs one cheap conditional request).
      if (r.pushed) { clearTimeout(verifyTimer); verifyTimer = setTimeout(syncNow, 1500); }
    } catch (e) {
      if (e && e.name === 'SyncError') {
        ui.sync = e.code === 'auth' ? 'auth' : 'error';
        ui.syncMsg = e.message;
      } else {
        ui.sync = navigator.onLine === false ? 'offline' : 'offline';
        ui.syncMsg = 'Could not reach GitHub. Changes are saved here and will sync when you are back online.';
      }
    } finally {
      syncing = false;
      renderStatus(); renderSync();
      if (again && ui.sync === 'ok') scheduleSync(300);
    }
  }

  function setToken(token) {
    cfg = { token: token.trim(), gistId: '', etag: '', lastSync: 0 };
    saveCfg();
    dirty = true; lsSet(DATA_KEY + ':dirty', '1');
  }
  function disconnect() {
    cfg = { token: '', gistId: '', etag: '', lastSync: 0 };
    saveCfg(); ui.sync = 'local'; ui.syncMsg = ''; ui.copyLink = '';
    renderStatus(); renderSync();
  }

  /* ---------- icons & dom helper ---------- */
  var IA = 'viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var ICONS = {
    todo: '<svg ' + IA + '><rect x="3" y="3" width="14" height="14" rx="4"/><path d="M7 10.3l2.1 2.1 4-4.4"/></svg>',
    shopping: '<svg ' + IA + '><path d="M4.2 7.2h11.6l-1.1 9.3H5.3z"/><path d="M7.4 7.2V6.1a2.6 2.6 0 015.2 0v1.1"/></svg>',
    x: '<svg ' + IA + '><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>',
    chev: '<svg ' + IA + '><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>',
    plus: '<svg ' + IA + '><path d="M10 4.5v11M4.5 10h11"/></svg>'
  };
  function icon(n) { var t = document.createElement('template'); t.innerHTML = ICONS[n]; return t.content.firstChild; }
  function h(tag, props) {
    var el = document.createElement(tag), p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null) el.append(x); });
      else if (c != null) el.append(c);
    }
    return el;
  }
  var toastTimer = null;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4000); }

  /* ---------- rendering ---------- */
  function ago(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return s + ' seconds ago';
    var m = Math.round(s / 60);
    if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    var hr = Math.round(m / 60);
    if (hr < 48) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
    return Math.round(hr / 24) + ' days ago';
  }

  function renderStatus() {
    var s = $('#status');
    var k = cfg.token ? ui.sync : 'local';
    var label = { local: 'On this device', syncing: 'Syncing', ok: 'Synced', offline: 'Offline', error: 'Sync problem', auth: 'Reconnect' }[k] || 'Synced';
    s.dataset.s = k === 'auth' ? 'error' : k;
    s.querySelector('span').textContent = label;
    s.setAttribute('aria-expanded', ui.syncOpen ? 'true' : 'false');
  }

  function renderSync() {
    var el = $('#sync');
    el.hidden = !ui.syncOpen;
    if (!ui.syncOpen) return;
    el.replaceChildren();
    if (!cfg.token) {
      var tokenIn = h('input', { id: 'tokenIn', type: 'password', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'ghp_…', 'aria-label': 'GitHub token' });
      el.append(
        h('h2', { text: 'Sync across your devices' }),
        h('p', { text: 'Your lists already work here with no account. To keep the same lists on your phone and computers, connect a GitHub token once on each device.' }),
        h('ol', {},
          h('li', {}, h('a', { href: 'https://github.com/settings/tokens/new?scopes=gist&description=Tickoff', target: '_blank', rel: 'noopener', text: 'Create a classic token' }), document.createTextNode(' with only the "gist" box ticked.')),
          h('li', { text: 'Copy it and paste it below.' }),
          h('li', { text: 'On your other devices, paste the same token, or use the setup link from a connected device.' })),
        tokenIn,
        ui.connectErr ? h('p', { class: 'err', text: ui.connectErr }) : null,
        h('div', { class: 'row2' },
          h('button', { class: 'primary small', type: 'button', text: 'Connect', onclick: async function () {
            var v = tokenIn.value.trim();
            if (!v) { ui.connectErr = 'Paste your token first.'; renderSync(); return; }
            ui.connectErr = ''; setToken(v); await syncNow();
            if (ui.sync === 'auth') { ui.connectErr = 'GitHub rejected that token. Check that you copied all of it.'; disconnect(); }
            else if (ui.sync === 'ok') { ui.syncOpen = false; }
            renderSync(); renderStatus();
          } }),
          h('button', { class: 'ghost', type: 'button', text: 'Close', onclick: toggleSync })),
        h('p', { text: 'Lists are stored in a secret gist in your GitHub account. Anyone who has that gist’s link could read it, so keep passwords out of your lists.' }));
    } else {
      var line = ui.sync === 'ok' || ui.sync === 'syncing' ? (cfg.lastSync ? 'Last synced ' + ago(cfg.lastSync) + '.' : 'Syncing for the first time.') : ui.syncMsg;
      el.append(
        h('h2', { text: 'Connected to GitHub' }),
        h('p', { class: ui.sync === 'error' || ui.sync === 'auth' ? 'err' : '', text: line }),
        ui.sync === 'auth' ? h('p', { text: 'The token no longer works. Disconnect and paste a new one.' }) : null,
        ui.copyLink ? h('input', { id: 'linkOut', type: 'text', readonly: true, value: ui.copyLink, 'aria-label': 'Setup link', onfocus: function (e) { e.target.select(); } }) : null,
        ui.copyLink ? h('p', { text: 'Open this link on another device to connect it. It contains your token, so keep it private.' }) : null,
        h('div', { class: 'row2' },
          h('button', { class: 'primary small', type: 'button', text: 'Sync now', onclick: syncNow }),
          h('button', { class: 'ghost', type: 'button', text: 'Setup link for another device', onclick: function () {
            ui.copyLink = location.origin + location.pathname + '#t=' + encodeURIComponent(cfg.token);
            renderSync();
            var f = $('#linkOut'); if (f) { f.focus(); f.select(); }
            try { navigator.clipboard.writeText(ui.copyLink).then(function () { toast('Setup link copied'); }, function () {}); } catch (e) {}
          } }),
          h('button', { class: 'ghost', type: 'button', text: 'Disconnect this device', onclick: disconnect }),
          h('button', { class: 'ghost', type: 'button', text: 'Close', onclick: toggleSync })));
    }
  }
  function toggleSync() { ui.syncOpen = !ui.syncOpen; ui.copyLink = ''; ui.connectErr = ''; renderStatus(); renderSync(); }

  function renderNav() {
    var ul = $('#nav');
    ul.replaceChildren();
    var counts = {};
    Object.keys(data.items).forEach(function (k) { var i = data.items[k]; if (!i.deleted && !i.done) counts[i.listId] = (counts[i.listId] || 0) + 1; });
    lists().forEach(function (l) {
      var on = l.id === ui.activeId;
      ul.append(h('li', {},
        h('button', { type: 'button', class: 'navbtn', 'aria-current': on ? 'true' : false, onclick: function () { select(l.id); } },
          icon(l.kind === 'shopping' ? 'shopping' : 'todo'),
          h('span', { class: 'name', text: l.name }),
          h('span', { class: 'n', text: String(counts[l.id] || 0) }))));
    });
    $('#newBtn').hidden = !$('#newForm').hidden;
  }

  function renderHead() {
    var el = $('#head');
    el.replaceChildren();
    var l = active();
    if (!l) return;
    var its = itemsOf(l.id);
    var openN = its.filter(function (i) { return !i.done; }).length;
    var doneN = its.length - openN;
    var shop = l.kind === 'shopping';
    var left;
    if (ui.renaming) {
      left = h('input', {
        id: 'renameIn', class: 'renamein', type: 'text', maxlength: '80', value: l.name, 'aria-label': 'List name',
        onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); finishRename(true); } else if (e.key === 'Escape') { finishRename(false); } },
        onblur: function () { finishRename(true); }
      });
    } else {
      left = h('h1', { class: 'title' }, h('button', { type: 'button', class: 'titlebtn', title: 'Rename list', onclick: startRename, text: l.name }));
    }
    var meta = shop ? (openN + ' to get · ' + doneN + ' in cart') : (openN + ' open · ' + doneN + ' done');
    var actions = h('div', { class: 'actions' });
    if (ui.confirmDelete) {
      actions.append(
        h('button', { type: 'button', class: 'ghost solid', onclick: doDelete, text: its.length ? 'Delete list and ' + its.length + (its.length === 1 ? ' item' : ' items') : 'Delete list' }),
        h('button', { type: 'button', class: 'ghost', onclick: function () { ui.confirmDelete = false; renderHead(); }, text: 'Cancel' }));
    } else {
      actions.append(h('button', { type: 'button', class: 'ghost danger', onclick: function () { ui.confirmDelete = true; renderHead(); }, text: 'Delete list' }));
    }
    el.append(h('div', { class: 'head' }, h('div', {}, left, h('div', { class: 'meta', text: meta })), actions));
  }

  function renderAdd() {
    var l = active();
    $('#addForm').hidden = !l;
    if (l) $('#addInput').placeholder = l.kind === 'shopping' ? 'Add an item, like oat milk' : 'Add a task';
  }

  function itemRow(i) {
    var li = h('li', { class: 'item' + (i.done ? ' done' : '') });
    var cb = h('input', { type: 'checkbox', checked: !!i.done, 'aria-label': (i.done ? 'Mark not done: ' : 'Mark done: ') + i.text, onchange: function () { model.toggleItem(i.id); } });
    li.append(h('label', { class: 'check' }, cb, h('span', { class: 'box' })));
    if (ui.editingId === i.id) {
      li.append(h('input', {
        id: 'editIn', class: 'editin', type: 'text', maxlength: '200', value: i.text, 'aria-label': 'Edit item',
        onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); finishEdit(true); } else if (e.key === 'Escape') { finishEdit(false); } },
        onblur: function () { finishEdit(true); }
      }));
    } else {
      li.append(h('button', { type: 'button', class: 'itext', title: 'Tap to edit', onclick: function () { startEdit(i.id); }, text: i.text }));
    }
    li.append(h('button', { type: 'button', class: 'rm', 'aria-label': 'Remove ' + i.text, onclick: function () { model.deleteItem(i.id); } }, icon('x')));
    return li;
  }

  function renderBody() {
    var el = $('#body');
    el.replaceChildren();
    var l = active();
    if (!l) {
      el.append(h('div', { class: 'empty' },
        h('h2', { text: 'Start your first list' }),
        h('p', { text: 'Make a to-do list for tasks or a shopping list for the store. You can rename it right after.' }),
        h('div', { class: 'row2' },
          h('button', { type: 'button', class: 'primary', onclick: function () { quickCreate('To-do', 'todo'); }, text: 'New to-do list' }),
          h('button', { type: 'button', class: 'ghost', onclick: function () { quickCreate('Shopping', 'shopping'); }, text: 'New shopping list' }))));
      return;
    }
    var shop = l.kind === 'shopping';
    var its = itemsOf(l.id);
    var open = its.filter(function (i) { return !i.done; });
    var done = its.filter(function (i) { return i.done; });
    if (!its.length) el.append(h('p', { class: 'hint', text: shop ? 'Nothing on this list yet. Add what you need above.' : 'No tasks yet. Add the first one above.' }));
    else if (!open.length) el.append(h('p', { class: 'hint', text: shop ? 'Everything is in the cart.' : 'All done.' }));
    else { var ul = h('ul', { class: 'items' }); open.forEach(function (i) { ul.append(itemRow(i)); }); el.append(ul); }
    if (done.length) {
      var collapsed = !!ui.collapsed[l.id];
      el.append(h('div', { class: 'donehead' },
        h('button', { type: 'button', class: 'donetoggle', 'aria-expanded': collapsed ? 'false' : 'true', onclick: function () { ui.collapsed[l.id] = !collapsed; renderBody(); } },
          icon('chev'), h('span', { text: (shop ? 'In the cart' : 'Done') + ' · ' + done.length })),
        h('button', { type: 'button', class: 'ghost', onclick: function () { model.clearDone(l.id); }, text: 'Clear' })));
      if (!collapsed) { var ul2 = h('ul', { class: 'items' }); done.forEach(function (i) { ul2.append(itemRow(i)); }); el.append(ul2); }
    }
  }

  function refresh() {
    ensureActive();
    renderStatus();
    renderNav();
    if (!ui.renaming) renderHead();
    renderAdd();
    if (!ui.editingId) renderBody();
  }

  /* ---------- actions ---------- */
  function select(id) {
    ui.activeId = id; lsSet(ACTIVE_KEY, id);
    ui.confirmDelete = false; ui.renaming = false; ui.editingId = null;
    renderNav(); renderHead(); renderAdd(); renderBody();
  }
  function startRename() { ui.renaming = true; renderHead(); var i = $('#renameIn'); if (i) { i.focus(); i.select(); } }
  function finishRename(commit) {
    if (!ui.renaming) return;
    var i = $('#renameIn'), v = i ? i.value.trim() : '', l = active();
    ui.renaming = false; renderHead();
    if (commit && v && l && v !== l.name) model.renameList(l.id, v.slice(0, 80));
  }
  function startEdit(id) { ui.editingId = id; renderBody(); var i = $('#editIn'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  function finishEdit(commit) {
    if (!ui.editingId) return;
    var id = ui.editingId, i = $('#editIn'), v = i ? i.value.trim() : '', it = data.items[id];
    ui.editingId = null; renderBody();
    if (commit && v && it && v !== it.text) model.editItem(id, v.slice(0, 200));
  }
  function doDelete() {
    var l = active(); if (!l) return;
    ui.confirmDelete = false; ui.activeId = null;
    model.deleteList(l.id);
  }
  function createList(name, kind) {
    var id = model.createList(name, kind);
    ui.activeId = id; lsSet(ACTIVE_KEY, id);
    ui.renaming = false; ui.editingId = null; ui.confirmDelete = false;
    refresh();
  }
  function quickCreate(name, kind) { createList(name, kind); }
  function openNew(on) {
    $('#newForm').hidden = !on;
    $('#newBtn').hidden = on;
    if (on) { $('#newName').value = ''; $('#newName').focus(); }
  }

  /* ---------- wiring ---------- */
  $('#newBtn').append(icon('plus'), h('span', { text: 'New list' }));
  $('#segTodo').prepend(icon('todo'));
  $('#segShop').prepend(icon('shopping'));
  $('#newBtn').addEventListener('click', function () { openNew(true); });
  $('#newCancel').addEventListener('click', function () { openNew(false); });
  $('#status').addEventListener('click', toggleSync);
  $('#newForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var kind = $('#newForm').elements.kind.value === 'shopping' ? 'shopping' : 'todo';
    var name = $('#newName').value.trim() || (kind === 'shopping' ? 'Shopping' : 'To-do');
    openNew(false);
    createList(name.slice(0, 80), kind);
  });
  $('#addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('#addInput'), v = inp.value.trim(), l = active();
    if (!v || !l) return;
    inp.value = '';
    model.addItem(l.id, v.slice(0, 200));
    inp.focus();
  });

  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') syncNow(); });
  window.addEventListener('online', syncNow);
  window.addEventListener('focus', function () { syncNow(); });
  setInterval(function () { if (document.visibilityState === 'visible') syncNow(); }, 25000);
  setInterval(function () { if (ui.syncOpen && cfg.token) renderSync(); }, 30000);

  // Setup link: https://…/#t=<token> connects this device, then removes the token from the address bar.
  (function consumeSetupLink() {
    var m = /^#t=(.+)$/.exec(location.hash || '');
    if (!m) return;
    try { setToken(decodeURIComponent(m[1])); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  })();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  ui.sync = cfg.token ? 'syncing' : 'local';
  refresh();
  if (cfg.token) syncNow();
})();
</script>
</body>
</html>
